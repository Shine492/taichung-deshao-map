<style>
/* Layout: full-height map, care-zone ledger docked left (bottom sheet on phones) */
:root {
  --bg: #f3f5f2; --panel: #ffffff; --fg: #1d2a26; --muted: #5d6b66; --line: #d9dfdb;
  --land: #e6ebe5; --land-line: #c3ccc5; --sea: #dfe8ec; --accent: #1f6f5c;
  --chip: #eef2ef;
  --font-display: "Noto Serif TC", "Songti TC", serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121816; --panel: #19211e; --fg: #e4ebe7; --muted: #95a49e; --line: #2c3833;
  --land: #1f2925; --land-line: #34423c; --sea: #141c1f; --accent: #6cc4aa; --chip: #232e2a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121816; --panel: #19211e; --fg: #e4ebe7; --muted: #95a49e; --line: #2c3833;
  --land: #1f2925; --land-line: #34423c; --sea: #141c1f; --accent: #6cc4aa; --chip: #232e2a; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); }
.app { height: 100%; display: grid; grid-template-columns: 340px 1fr; }
aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; min-width: 0;
  padding-block: 20px 24px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: 18px;
  display: flex; flex-direction: column; gap: 16px; }
h1 { font-family: var(--font-display); font-weight: 900; font-size: 1.6rem; margin: 0; letter-spacing: .02em; text-wrap: balance; }
.sub { color: var(--muted); font-size: .82rem; margin-top: 4px; line-height: 1.5; }
.total { display: flex; align-items: baseline; gap: 8px; }
.total b { font-family: var(--font-display); font-size: 2.6rem; line-height: 1; font-variant-numeric: tabular-nums; color: var(--accent); }
.total span { color: var(--muted); font-size: .9rem; }
.hint { font-size: .8rem; color: var(--muted); background: var(--chip); border-radius: 8px; padding: 8px 10px; line-height: 1.55; }
.views { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 10px; padding: 3px; background: var(--chip); }
.views button { font: inherit; font-size: .88rem; font-weight: 700; border: 0; background: none; color: var(--muted); padding: 8px 2px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
.views button.on { background: var(--vc); color: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.app { --vc: var(--accent); }
/* 每個檢視有自己的主色：左側摘要卡、地圖底色、外框、標題都跟著換 */
.vcard { margin-top: 10px; border: 1.5px solid var(--vc); border-radius: 12px; padding: 12px 14px; background: color-mix(in srgb, var(--vc) 12%, var(--panel)); }
.vc-t { font-family: var(--font-display); font-weight: 900; font-size: 1.35rem; color: var(--vc); line-height: 1.2; }
.vc-s { font-size: .78rem; color: var(--muted); margin-top: 2px; }
.vc-bar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; margin-top: 10px; background: var(--line); }
.vc-bar i { display: block; height: 100%; }
.vc-nums { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin-top: 8px; text-align: center; }
.vc-nums b { display: block; font-size: 1.5rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.vc-nums span { font-size: .74rem; color: var(--muted); white-space: nowrap; }
.app[data-view]:not([data-view="stage"]) #map { background: color-mix(in srgb, var(--vc) 14%, var(--sea)); }
.vframe { position: absolute; inset: 0; pointer-events: none; z-index: 450; border: 0 solid var(--vc); transition: border-width .2s ease; }
.app[data-view]:not([data-view="stage"]) .vframe { border-width: 5px; }
.vchip { position: absolute; z-index: 500; top: calc(12px + env(safe-area-inset-top, 0px)); left: 56px; max-width: calc(100% - 260px);
  background: var(--vc); color: #fff; border-radius: 10px; padding: 6px 12px; box-shadow: 0 2px 8px rgba(0,0,0,.2); line-height: 1.35; }
.vchip b { font-family: var(--font-display); font-size: 1.05rem; font-weight: 900; }
.vchip small { display: block; font-size: .72rem; opacity: .95; }
@media (max-width: 760px) { .vchip { top: auto; bottom: 12px; left: 12px; max-width: calc(100% - 24px); } }
.views button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.rule { font-size: .74rem; color: var(--muted); margin-top: 6px; line-height: 1.5; }
.sec { font-size: .78rem; color: var(--muted); margin-bottom: 6px; letter-spacing: .04em; }
.stages { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); grid-auto-flow: column; gap: 5px; }
.st { min-width: 0; }
.st span { white-space: nowrap; font-size: .72rem !important; }
.st { font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 2px; padding: 6px 4px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--fg); cursor: pointer; min-height: 72px; }
.st span { font-size: .78rem; }
.st b { font-variant-numeric: tabular-nums; font-size: .9rem; }
.st.on { border-color: var(--accent); background: var(--chip); }
.st:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.st-all { font-weight: 700; flex: 1; display: grid; place-items: center; }
.st .kid { filter: none; }
.ledger { display: flex; flex-direction: column; gap: 4px; }
.zone { border-radius: 8px; padding: 8px 10px; cursor: pointer; border: 1px solid transparent; }
.zone:hover, .zone.on { background: var(--chip); }
.zone:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.zone-head { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.sw { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.zone-head .n { margin-left: auto; font-variant-numeric: tabular-nums; }
.bar { height: 4px; border-radius: 2px; background: var(--line); margin-top: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 2px; }
.dqs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
.dqs button { font: inherit; font-size: .74rem; border: 1px solid var(--line); background: var(--panel); color: var(--fg);
  border-radius: 999px; padding: 2px 8px; cursor: pointer; font-variant-numeric: tabular-nums; }
.dqs button.zero { color: var(--muted); }
.dqs button:hover { border-color: var(--accent); }
.foot { font-size: .74rem; color: var(--muted); line-height: 1.6; margin-top: auto; }
.mapwrap { position: relative; min-width: 0; }
#map { position: absolute; inset: 0; background: var(--sea); }
.mode { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); z-index: 500;
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px; display: flex; gap: 2px; font-size: .8rem; }
.mode button { font: inherit; border: 0; background: none; color: var(--muted); padding: 5px 12px; border-radius: 999px; cursor: pointer; }
.mode button.on { background: var(--accent); color: var(--panel); font-weight: 700; }

/* count badges on the map */
.badge { display: flex; flex-direction: column; align-items: center; pointer-events: none; transform: translate(-50%, -50%); width: max-content; }
.badge .c { min-width: 30px; height: 30px; padding: 0 7px; border-radius: 999px; display: grid; place-items: center;
  color: #fff; font-weight: 700; font-size: .95rem; font-variant-numeric: tabular-nums; box-shadow: 0 1px 4px rgba(0,0,0,.25); border: 2px solid #fff; }
.badge .l { font-size: .72rem; font-weight: 700; color: var(--fg); margin-top: 2px; text-shadow: 0 0 3px var(--bg), 0 0 3px var(--bg), 0 0 3px var(--bg); white-space: nowrap; }
.badge.big .c { min-width: 46px; height: 46px; font-size: 1.25rem; }
.badge.big .l { font-size: .9rem; }
.sgs { display: flex; gap: 2px; margin-top: 2px; }
.sg { font-size: .66rem; font-weight: 700; line-height: 1; padding: 2px 4px; border-radius: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sg-小 { background: #f6d55c; color: #4a3a00; }
.sg-中 { background: #dfe7f2; color: #1f3550; }
.sg-高 { background: #2f4a6b; color: #fff; }
.sg-未 { background: var(--chip); color: var(--muted); }
.badge.pop .sgs { transform: scale(1.1); }
.tip-st { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.tip-st .sg { font-size: .74rem; padding: 3px 6px; }
.badge.zero .c { background: var(--muted) !important; opacity: .7; min-width: 22px; height: 22px; font-size: .75rem; }

/* little-person markers: wave + smile when their 大區 is hovered */
.kid { filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.22)); }
/* hovered 大區 lifts off the map; the rest step back */
.leaflet-overlay-pane path { transition: fill-opacity .2s ease, stroke-width .2s ease; }
.leaflet-overlay-pane path.pop { filter: drop-shadow(0 6px 10px rgba(0,0,0,.35)); }
.badge .c { transition: transform .2s ease; }
.badge.pop .c { transform: scale(1.25); }
.badge.pop .l { font-size: .85rem; }
.kdot { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid #fff; box-shadow: 0 0 2px rgba(0,0,0,.35); box-sizing: border-box; }
.kid svg { display: block; overflow: visible; }
.kid .arm { transform-box: view-box; }
.kid .m1, .kid .ck { opacity: 0; transition: opacity .2s ease; }
.kid .m0 { transition: opacity .2s ease; }
.kid.hi .m1 { opacity: 1; }
.kid.hi .ck { opacity: .75; }
.kid.hi .m0 { opacity: 0; }
.kid.hi .arm { animation: wave 2.2s ease-in-out 1 both; }
@keyframes wave {
  0% { transform: rotate(0); }
  15% { transform: rotate(-170deg); }
  28% { transform: rotate(-95deg); }
  41% { transform: rotate(-170deg); }
  54% { transform: rotate(-95deg); }
  67% { transform: rotate(-170deg); }
  80% { transform: rotate(-120deg); }
  100% { transform: rotate(0); }
}
@media (prefers-reduced-motion: reduce) { .kid.hi .arm { animation: none; } }

/* tooltip card */
.tip { font-family: var(--font-body); min-width: 150px; }
.tip h3 { margin: 0 0 2px; font-size: .95rem; }
.tip .k { color: var(--muted); font-size: .76rem; }
.tip .big { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.tip ul { margin: 6px 0 0; padding: 0; list-style: none; font-size: .8rem; display: grid; grid-template-columns: auto auto; gap: 1px 12px; }
.tip li { display: contents; }
.tip li.hd span { color: var(--muted); font-size: .72rem; }
.tip .apps { font-size: .8rem; color: var(--fg); background: var(--chip); border-radius: 6px; padding: 3px 8px; margin-top: 4px; display: inline-block; }
.tip .apps b { font-variant-numeric: tabular-nums; }
.zone-apps { font-size: .76rem; color: var(--muted); margin-top: 4px; }
.total-apps { color: var(--muted); font-size: .85rem; margin-top: -8px; }
.total-apps b { color: var(--fg); font-variant-numeric: tabular-nums; }
.tip li span:last-child { text-align: right; font-variant-numeric: tabular-nums; }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 58% 42%; }

}

.leaflet-tooltip{position:absolute;padding:8px 10px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;white-space:nowrap;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.18)}

</style>

const COLORS = { '南一':'#c8414f','南二':'#e0773a','南三':'#bf9420','北一':'#22668f','北二':'#3d9bd6',
  '西一':'#24845a','西二':'#6aab5f','中一':'#73479b','中二':'#a074c4','中三':'#bb5192' };
const DETAIL_ZOOM = 11.25;
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

const map = L.map('map', { zoomSnap: .25, zoomDelta: 1, wheelPxPerZoomLevel: 28, wheelDebounceTime: 15,
  attributionControl: false, preferCanvas: false, minZoom: 8.5, maxZoom: 16 });
const allBounds = L.geoJSON(DATA.care.map(c => c.geom)).getBounds();
let userMoved = false;
const fitAll = () => { map.invalidateSize(); map.fitBounds(allBounds, { padding: [20, 20], animate: false }); };
map.setView(allBounds.getCenter(), 10);
fitAll();
map.setMaxBounds(allBounds.pad(0.6));
map.getContainer().addEventListener('pointerdown', () => { userMoved = true; });
map.getContainer().addEventListener('wheel', () => { userMoved = true; }, { passive: true });
new ResizeObserver(() => { if (!userMoved) fitAll(); else map.invalidateSize(); }).observe(map.getContainer());

// base: 行政區
const base = L.geoJSON({ type: 'FeatureCollection', features: DATA.districts.map(d => ({ type: 'Feature', properties: { name: d.name }, geometry: d.geom })) },
  { interactive: false, style: () => ({ color: cssVar('--land-line'), weight: 1, fillColor: cssVar('--land'), fillOpacity: 1 }) }).addTo(map);

const maxDq = Math.max(...DATA.dq.map(d => d.count));
const careLayer = L.layerGroup(), dqLayer = L.layerGroup(), dotLayer = L.layerGroup(), careBadges = L.layerGroup(), dqBadges = L.layerGroup();
const careShapes = {}, dqShapes = {}, dqBadgeOf = {}, careBadgeOf = {};

const onl = o => o ? `（含線上報名 ${o}）` : '';
const appsLine = (n, o) => `<div class="apps">申請填表累計 <b>${n}</b> 份${onl(o)}</div>`;
// ── 檢視：學習階段，或依點名系統最近 8 週的主日／小排／家聚會次數分級 ──
const ATT_CATS = [
  { k: '穩定', a: '穩', col: '#2e9e5b', test: n => n >= 5 },
  { k: '建立中', a: '建', col: '#e0a526', test: n => n >= 2 },
  { k: '需加強', a: '需', col: '#d1495b', test: n => true },
  { k: '未點名', a: '未', col: '#9aa5a0', test: null },
];
const attView = (idx, label) => ({ label, cats: ATT_CATS,
  catOf: s => { const v = s.att ? s.att[idx] : null; if (v == null) return '未點名'; return ATT_CATS.find(c => c.test && c.test(v)).k; },
  count: s => s.att ? s.att[idx] : null });
const VIEWS = {
  stage: { label: '學習階段', cats: [
      { k: '國小', a: '小' }, { k: '國中', a: '中' }, { k: '高中', a: '高' }, { k: '未填', a: '未' }],
    catOf: s => s.st || '未填' },
  主日: attView(0, '主日'), 小排: attView(1, '小排'), 家聚會: attView(2, '家聚會'),
};
let view = 'stage';
const V = () => VIEWS[view];
const catColor = (s, careCol) => view === 'stage' ? careCol : V().cats.find(c => c.k === V().catOf(s)).col;
function countsFor(filter) {
  const o = Object.fromEntries(V().cats.map(c => [c.k, 0]));
  DATA.students.forEach(s => { if (filter(s)) o[V().catOf(s)]++; });
  return o;
}
const dqCounts = n => countsFor(s => s.dq === n);
const careCounts = c => countsFor(s => c.dqs.includes(s.dq));
const chipStyle = c => c.col ? ` style="background:${c.col};color:#fff"` : '';
// 標示上的小標籤：最後一類（未填／未點名）不放，數字 0 不放
const chipsRow = o => {
  const parts = V().cats.slice(0, -1).filter(c => o[c.k]).map(c => `<span class="sg sg-${c.a}"${chipStyle(c)}>${c.a}${o[c.k]}</span>`);
  return parts.length ? `<div class="sgs">${parts.join('')}</div>` : '';
};
const chipsList = o => `<div class="tip-st">${V().cats.map(c => `<span class="sg sg-${c.a}"${chipStyle(c)}>${c.k} ${o[c.k] || 0}</span>`).join('')}</div>`;
const viewNote = () => view === 'stage' ? '' : `<div class="k" style="margin-top:4px">${V().label}・最近 8 週（${DATA.attMeta.weeks[0].slice(5).replace('-', '/')}–${DATA.attMeta.weeks[1].slice(5).replace('-', '/')}）</div>`;

function tipCare(c) {
  const rows = `<li class="hd"><span>大區</span><span>得少／填表</span></li>` + c.dqs.map(n => { const d = DATA.dq.find(x => x.n === n);
    return `<li><span>${n} 大區</span><span>${d ? d.count : 0}／${d ? d.apps : 0}</span></li>`; }).join('');
  return `<div class="tip"><div class="k">照顧區</div><h3>${c.name}</h3><div class="big">${c.count} <span class="k">位得少</span></div>${viewNote()}${chipsList(careCounts(c))}${appsLine(c.apps, c.online)}<ul>${rows}</ul></div>`;
}
function tipDq(d) {
  const xq = Object.entries(d.xq).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<li><span>${k}</span><span>${v}</span></li>`).join('');
  return `<div class="tip"><div class="k">${d.care || '—'} 照顧區</div><h3>臺中 ${d.n} 大區</h3><div class="big">${d.count} <span class="k">位得少</span></div>${d.count ? viewNote() + chipsList(dqCounts(d.n)) : ''}${appsLine(d.apps, d.online)}${xq ? `<ul>${xq}</ul>` : ''}</div>`;
}
function badgeIcon(count, label, big, extra = '') {
  const cls = 'badge' + (big ? ' big' : '') + (count === 0 ? ' zero' : '');
  return L.divIcon({ className: '', iconSize: null,
    html: `<div class="${cls}"><div class="c" style="background:${COLORS[label.care] || '#888'}">${count}</div><div class="l">${label.text}</div>${extra}</div>` });
}
function badge(latlng, count, label, big, extra = '') {
  return L.marker(latlng, { interactive: false, keyboard: false, zIndexOffset: 5000, icon: badgeIcon(count, label, big, extra) });
}

DATA.care.forEach(c => {
  const col = COLORS[c.name];
  const shp = L.geoJSON(c.geom, { style: { color: col, weight: 2, fillColor: col, fillOpacity: .28 } })
    .bindTooltip(() => tipCare(c), { sticky: true, direction: 'top', offset: [0, -8] })
    .on('mouseover', e => e.target.setStyle({ fillOpacity: .5, weight: 3 }))
    .on('mouseout', e => e.target.setStyle({ fillOpacity: .28, weight: 2 }))
    .on('click', () => map.flyToBounds(shp.getBounds(), { padding: [30, 30], duration: .6 }));
  careShapes[c.name] = shp; careLayer.addLayer(shp);
  const b = badge(c.label, c.count, { care: c.name, text: c.name }, true, chipsRow(careCounts(c)));
  careBadgeOf[c.name] = b; careBadges.addLayer(b);
});

DATA.dq.forEach(d => {
  const col = COLORS[d.care] || '#888';
  const op = d.count ? .12 + .45 * (d.count / maxDq) : .04;
  const shp = L.geoJSON(d.geom, { style: { color: col, weight: 1.5, fillColor: col, fillOpacity: op } })
    .bindTooltip(() => tipDq(d), { sticky: true, direction: 'top', offset: [0, -8] })
    .on('mouseover', () => { popDq(d.n, true); greet(d.n, true); })
    .on('mouseout', () => { popDq(d.n, false); greet(d.n, false); })
    .on('click', () => map.flyToBounds(shp.getBounds(), { padding: [40, 40], duration: .6, maxZoom: 14 }));
  shp._op = op; shp._stroke = col;
  dqShapes[d.n] = shp; dqLayer.addLayer(shp);
  const b = badge(d.label, d.count, { care: d.care, text: d.n + ' 大區' }, false, chipsRow(dqCounts(d.n)));
  dqBadgeOf[d.n] = b; dqBadges.addLayer(b);
});

// 指到的大區浮起來、變清楚，其他大區淡下去
let popped = null, popTimer = null;
function popDq(n, on) {
  clearTimeout(popTimer);
  if (on) { if (popped === n) return; if (popped !== null) applyPop(popped, false); popped = n; applyPop(n, true); }
  else popTimer = setTimeout(() => { if (popped === n) { applyPop(n, false); popped = null; } }, 90);
}
function applyPop(n, on) {
  Object.entries(dqShapes).forEach(([k, shp]) => {
    const me = +k === n;
    if (on) {
      shp.setStyle(me ? { fillOpacity: Math.min(shp._op + .35, .85), weight: 4, color: '#fff' }
                      : { fillOpacity: shp._op * .35, weight: 1, color: shp._stroke });
      if (me) { shp.bringToFront(); shp.eachLayer(l => l.getElement()?.classList.add('pop')); }
    } else {
      shp.setStyle({ fillOpacity: shp._op, weight: 1.5, color: shp._stroke });
      shp.eachLayer(l => l.getElement()?.classList.remove('pop'));
    }
  });
  dqBadgeOf[n]?.getElement()?.firstElementChild.classList.toggle('pop', on);
}

const arms = (col, l, r, hand) => `
  <path d="M${l[0]} ${l[1]} ${l[2]} ${l[3]}" stroke="${col}" stroke-width="2.4" stroke-linecap="round"/>
  <g class="arm" style="transform-origin:${r[0]}px ${r[1]}px"><path d="M${r[0]} ${r[1]} ${r[2]} ${r[3]}" stroke="${col}" stroke-width="2.4" stroke-linecap="round"/><circle cx="${hand[0]}" cy="${hand[1]}" r="1.25" fill="#f6d3b3"/></g>`;
const KID_PARTS = {
  '國小': col => `
    <rect x="4.4" y="19.6" width="3" height="5.4" rx="1.2" fill="#e2574c"/><rect x="14.6" y="19.6" width="3" height="5.4" rx="1.2" fill="#e2574c"/>
    <path d="M6.8 26.6V21.8a4.2 4.2 0 0 1 8.4 0v4.8z" fill="${col}" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>
    ${arms(col, [7.2, 20.2, 5.4, 24], [14.8, 20, 16.6, 23.8], [16.7, 24])}
    <circle cx="11" cy="13.6" r="5.6" fill="#f6d3b3" stroke="#fff" stroke-width="1.2"/>
    <path d="M5.3 12.6a5.7 5.7 0 0 1 11.4 0z" fill="#f2c230"/><path d="M4.4 12.6h13.2" stroke="#d9a91b" stroke-width="1.1" stroke-linecap="round"/>
    ${face(13.8)}`,
  '國中': col => `
    <path d="M6.2 26.6V20.2a4.8 4.8 0 0 1 9.6 0v6.4z" fill="${col}" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M8.2 15.8 11 19.4l2.8-3.6z" fill="#fff"/>
    ${arms(col, [6.8, 18.6, 4.6, 22.8], [15.2, 18.4, 17.4, 22.8], [17.5, 23])}
    <circle cx="11" cy="11" r="5.3" fill="#f6d3b3" stroke="#fff" stroke-width="1.2"/>${hair(11)}${face(11)}`,
  '高中': col => `
    <path d="M15.4 14.8 6.6 25.6" stroke="#7a5a3a" stroke-width="1.1"/>
    <path d="M5.8 27V17.6a5.2 5.2 0 0 1 10.4 0V27z" fill="${col}" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M8.6 13.2 11 15.6l2.4-2.4z" fill="#fff"/><path d="M10.4 15.2h1.2l.5 5.2-1.1 1.2-1.1-1.2z" fill="#1f3550"/>
    <rect x="3.8" y="23" width="3.6" height="3.4" rx=".6" fill="#7a5a3a"/>
    ${arms(col, [6.4, 15.8, 4.4, 21], [15.6, 15.6, 17.8, 20.8], [17.9, 21])}
    <circle cx="11" cy="7.8" r="5.2" fill="#f6d3b3" stroke="#fff" stroke-width="1.2"/>
    <path d="M5.8 7.4a5.2 5.2 0 0 1 10.4 0c-1.2-.6-2.6-2-5.2-1.6-2.6-.4-4 1-5.2 1.6z" fill="#4a3426"/>${face(7.8)}`,
  '未填': col => `
    <path d="M6.2 26.6V20.2a4.8 4.8 0 0 1 9.6 0v6.4z" fill="${col}" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>
    ${arms(col, [6.8, 18.6, 4.6, 22.8], [15.2, 18.4, 17.4, 22.8], [17.5, 23])}
    <circle cx="11" cy="11" r="5.3" fill="#f6d3b3" stroke="#fff" stroke-width="1.2"/>${hair(11)}${face(11)}`,
};
const kidSvg = (col, st, w = 40, h = 51) =>
  `<div class="kid" style="width:${w}px;height:${h}px"><svg viewBox="0 0 22 28" width="${w}" height="${h}" aria-hidden="true">${KID_PARTS[st || '未填'](col)}</svg></div>`;

const kidsByDq = {}, leaveTimers = {}, greeted = {};
function greet(n, on) {
  clearTimeout(leaveTimers[n]);
  const apply = v => {
    if (!!greeted[n] === v) return; greeted[n] = v;
    (kidsByDq[n] || []).forEach(m => {
      if (curTier < 2) { m.setIcon(kidIcon(m._s, v ? 2 : curTier)); m.setZIndexOffset(v ? 1000 : 0); applyFilter(m); }
      const el = m.getElement(); if (el && el.firstElementChild.classList.contains('kid')) el.firstElementChild.classList.toggle('hi', v);
    });
  };
  if (on) apply(true); else leaveTimers[n] = setTimeout(() => apply(false), 150);
}

// 小人大小跟著縮放：遠看是小圓點，中距離是小小人，拉近才是完整小人；游標指到的大區會暫時放大
const tierOf = z => z < 12.25 ? 0 : z < 13.5 ? 1 : 2;
let curTier = tierOf(map.getZoom());
const KID_SIZE = [null, [24, 31, 12, 29], [40, 51, 20, 48]];
function kidIcon(s, t = curTier) {
  const col = catColor(s, COLORS[DATA.dq.find(x => x.n === s.dq).care] || '#888');
  if (t === 0) return L.divIcon({ className: '', iconSize: [11, 11], iconAnchor: [5.5, 5.5], html: `<div class="kdot" style="background:${col}"></div>` });
  const [w, h, ax, ay] = KID_SIZE[t];
  return L.divIcon({ className: '', iconSize: [w, h], iconAnchor: [ax, ay], html: kidSvg(col, s.st, w, h) });
}
function kidTip(s) {
  let line = s.st || '階段未填';
  if (view !== 'stage') { const n = V().count(s); line = `${s.st || '階段未填'}・${V().label} ${n == null ? '未列入點名' : `${n}／8 週・${V().catOf(s)}`}`; }
  return `<div class="tip">${s.id ? `<div class="k">得少編號</div><h3>${s.id}</h3>` : `<h3>${s.dq} 大區得少</h3>`}<div class="k">${s.xq ? s.xq + ' 小區・' : ''}${line}</div></div>`;
}
const kids = [];
DATA.students.forEach(s => {
  const m = L.marker([s.lat, s.lng], { keyboard: false, riseOnHover: true, icon: kidIcon(s) })
    .bindTooltip(() => kidTip(s), { direction: 'top', offset: [0, -48] })
    .on('mouseover', () => greet(s.dq, true))
    .on('mouseout', () => greet(s.dq, false))
    .addTo(dotLayer);
  m._s = s; kids.push(m);
  (kidsByDq[s.dq] = kidsByDq[s.dq] || []).push(m);
});

// 圖例＋篩選（隨檢視改變）
let catOn = 'all';
const legend = document.getElementById('stages');
const legendTitle = document.getElementById('legendTitle');
const applyFilter = m => { const el = m.getElement(); if (el) el.style.display = (catOn === 'all' || V().catOf(m._s) === catOn) ? '' : 'none'; };
function buildLegend() {
  const o = countsFor(() => true);
  const cats = V().cats.filter((c, i) => i < V().cats.length - 1 || o[c.k]);
  legendTitle.textContent = view === 'stage' ? '學習階段（點選只顯示該階段的小人）'
    : `${V().label}・最近 8 週出席（點選只顯示該類的小人）`;
  legend.innerHTML = `<button class="st on" data-st="all"><span class="st-all">全部</span><b>${DATA.total}</b></button>` +
    cats.map(c => `<button class="st" data-st="${c.k}">${view === 'stage' ? kidSvg('#7b8a84', c.k, 26, 33) : kidSvg(c.col, '未填', 26, 33)}<span>${c.k === '未填' ? '未填階段' : c.k}</span><b>${o[c.k]}</b></button>`).join('');
  document.getElementById('rule').hidden = view === 'stage';
}
legend.addEventListener('click', e => {
  const b = e.target.closest('button[data-st]'); if (!b) return;
  catOn = b.dataset.st;
  legend.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  kids.forEach(applyFilter);
});
map.on('layeradd', e => { if (e.layer._s && catOn !== 'all') applyFilter(e.layer); });
map.on('zoomend', () => { const t = tierOf(map.getZoom()); if (t === curTier) return; curTier = t;
  Object.keys(greeted).forEach(k => { greeted[k] = false; });
  kids.forEach(m => { m.setIcon(kidIcon(m._s)); m.setZIndexOffset(0); applyFilter(m); }); });

// 總選項：切換整張圖
function setView(v) {
  view = v; catOn = 'all';
  document.querySelectorAll('#views button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  kids.forEach(m => { m.setIcon(kidIcon(m._s)); applyFilter(m); });
  DATA.dq.forEach(d => dqBadgeOf[d.n].setIcon(badgeIcon(d.count, { care: d.care, text: d.n + ' 大區' }, false, chipsRow(dqCounts(d.n)))));
  DATA.care.forEach(c => careBadgeOf[c.name].setIcon(badgeIcon(c.count, { care: c.name, text: c.name }, true, chipsRow(careCounts(c)))));
  buildLegend();
  paintView();
}
// 檢視主色＋區塊底色：聚會檢視時，大區／照顧區底色代表「穩定比例」
const VC = { 主日: '#d98a1f', 小排: '#2f7fc4', 家聚會: '#c9506e' };
function zoneColor(o) {
  const known = o['穩定'] + o['建立中'] + o['需加強'];
  if (!known) return ['#9aa5a0', .1];
  const r = o['穩定'] / known;
  return [r >= .5 ? '#2e9e5b' : r >= .25 ? '#e0a526' : '#d1495b', .55];
}
function paintView() {
  const app = document.querySelector('.app'), att = view !== 'stage';
  app.dataset.view = view;
  if (att) app.style.setProperty('--vc', VC[view]); else app.style.removeProperty('--vc');
  DATA.dq.forEach(d => {
    const shp = dqShapes[d.n];
    let col = COLORS[d.care] || '#888', op = d.count ? .12 + .45 * (d.count / maxDq) : .04, stroke = col;
    if (att) { [col, op] = d.count ? zoneColor(dqCounts(d.n)) : ['#9aa5a0', .05]; stroke = '#ffffff'; }
    shp._op = op; shp._stroke = stroke;
    shp.setStyle({ color: stroke, fillColor: col, fillOpacity: op, weight: 1.5 });
  });
  DATA.care.forEach(c => { const col = att ? zoneColor(careCounts(c))[0] : COLORS[c.name]; careShapes[c.name].setStyle({ color: att ? '#ffffff' : col, fillColor: col, fillOpacity: att ? .55 : .28 }); });
  const chip = document.getElementById('vchip'), card = document.getElementById('vcard');
  chip.hidden = card.hidden = !att;
  if (!att) return;
  const wk = DATA.attMeta.weeks.map(w => w.slice(5).replace('-', '/').replace(/^0/, '')).join('–');
  chip.innerHTML = `<b>${V().label}出席</b><small>最近 8 週 ${wk}・區塊底色＝穩定比例：綠 ≥50%、黃 25–49%、紅 &lt;25%</small>`;
  const o = countsFor(() => true);
  card.innerHTML = `<div class="vc-t">${V().label}出席</div><div class="vc-s">最近 8 週（${wk}）・共 ${DATA.total} 位</div>
    <div class="vc-bar">${ATT_CATS.map(c => `<i style="width:${(o[c.k] / DATA.total * 100).toFixed(1)}%;background:${c.col}" title="${c.k} ${o[c.k]}"></i>`).join('')}</div>
    <div class="vc-nums">${ATT_CATS.map(c => `<div><b style="color:${c.col}">${o[c.k]}</b><span>${c.k}</span></div>`).join('')}</div>`;
}
document.getElementById('views').addEventListener('click', e => { const b = e.target.closest('button[data-v]'); if (b) setView(b.dataset.v); });
if (!DATA.attMeta) document.getElementById('viewsWrap').hidden = true;
buildLegend();

let mode = 'auto';
function render() {
  const detail = mode === 'dq' || (mode === 'auto' && map.getZoom() >= DETAIL_ZOOM);
  const want = detail ? [dqLayer, dotLayer, dqBadges] : [careLayer, careBadges];
  [careLayer, careBadges, dqLayer, dotLayer, dqBadges].forEach(l => {
    const on = want.includes(l);
    if (on && !map.hasLayer(l)) map.addLayer(l);
    if (!on && map.hasLayer(l)) map.removeLayer(l);
  });
}
map.on('zoomend', render); render();

const modeBtns = { auto: mAuto, care: mCare, dq: mDq };
Object.entries(modeBtns).forEach(([k, b]) => b.addEventListener('click', () => {
  mode = k; Object.values(modeBtns).forEach(x => x.classList.toggle('on', x === b)); render();
}));

// ledger
document.getElementById('total').textContent = DATA.total;
document.getElementById('zoneCount').textContent = DATA.care.length;
document.getElementById('appsTotal').textContent = DATA.appsTotal;
document.getElementById('onlineTotal').textContent = onl(DATA.onlineTotal);
document.getElementById('rosterName').textContent = DATA.rosterName;
const maxCare = Math.max(...DATA.care.map(c => c.count));
const ledger = document.getElementById('ledger');
[...DATA.care].sort((a, b) => b.count - a.count).forEach(c => {
  const col = COLORS[c.name];
  const el = document.createElement('div');
  el.className = 'zone'; el.tabIndex = 0; el.setAttribute('role', 'button');
  const chips = c.dqs.map(n => { const d = DATA.dq.find(x => x.n === n); const k = d ? d.count : 0;
    return `<button data-dq="${n}" class="${k ? '' : 'zero'}" aria-label="${n} 大區 ${k} 位">${n}大區 · ${k}</button>`; }).join('');
  el.innerHTML = `<div class="zone-head"><span class="sw" style="background:${col}"></span>${c.name}照顧區<span class="n">${c.count}</span></div>
    <div class="bar"><i style="width:${(c.count / maxCare * 100).toFixed(1)}%;background:${col}"></i></div>
    <div class="zone-apps">申請填表累計 ${c.apps} 份${onl(c.online)}</div><div class="dqs">${chips}</div>`;
  const go = () => map.flyToBounds(careShapes[c.name].getBounds(), { padding: [30, 30], duration: .6 });
  el.addEventListener('click', e => {
    const b = e.target.closest('button[data-dq]');
    if (b) { const shp = dqShapes[+b.dataset.dq]; map.flyToBounds(shp.getBounds(), { padding: [40, 40], duration: .6, maxZoom: 14 });
      shp.once ? setTimeout(() => shp.eachLayer(l => l.openTooltip(l.getBounds().getCenter())), 700) : 0; return; }
    go();
  });
  el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  el.addEventListener('mouseenter', () => { if (map.hasLayer(careLayer)) careShapes[c.name].setStyle({ fillOpacity: .5, weight: 3 }); });
  el.addEventListener('mouseleave', () => { careShapes[c.name].setStyle({ fillOpacity: .28, weight: 2 }); });
  ledger.appendChild(el);
});

const out = DATA.outside.map(o => `${o.place}（${o.id}）`).join('、');
document.getElementById('foot').innerHTML =
  `小人按各得少所屬大區放在區內，代表「屬於哪一區」，不是實際住址。` +
  (out ? `<br>不在台中範圍、未列入地圖：${out}。` : '') +
  `<br>學習階段：取自「111年至115年台中得少(含結案)」統計表中各人最新的年級（五專一至三年級列為高中）。` +
  (DATA.attMeta ? `<br>主日／小排／家聚會：取自「${DATA.attMeta.source}」最近 8 週（${DATA.attMeta.weeks.join(' 至 ')}），依姓名比對；家聚會為同週有出訪或受訪算 1 次。` : '') +
  `<br>申請填表累計：2023 年起「得榮少年教育專案報名表（台中）」回覆中已分派大區的筆數，加上「得少線上報名」中已分派大區、且未與前者重複的筆數，含未進入專案者（${DATA.appsAsOf} 讀取）。線上報名已進入專案的得少都已在最新名單內，計入各區得少人數。` +
  `<br>區界取自「台中市召會各大區區域與會所分布圖」。`;
</script>
